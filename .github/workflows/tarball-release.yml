name: Tarball release

# Builds and publishes a packed tarball as a GitHub Release whenever a `v*` tag is pushed.
# Consumed by downstream projects (e.g., bc) via:
#   "@sillsdev/docu-notion": "https://github.com/Onebrief/docu-notion/releases/download/<tag>/<tarball>"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set package version from tag
        # Strips a leading "v" if present. Updates package.json and package-lock.json so
        # downstream consumers see a real version field on the packed tarball.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install (runs prepare → builds dist/)
        run: npm ci

      - name: Pack
        id: pack
        run: |
          TARBALL=$(npm pack 2>/dev/null | tail -n1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.tarball }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
